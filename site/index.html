<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Québec French</title>
<meta name="description" content="Québec French — an Android app for learning the French spoken in Québec.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1c1c1e; --muted: #5c5c66;
    --rule: #e2e2e8; --accent: #002395;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --fg: #e8e8ec; --muted: #a0a0ac; --rule: #2c2c33; --accent: #8aa8ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
  p { margin: 0 0 1.25rem; }
  .sub { color: var(--muted); }
  a { color: var(--accent); }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: .55rem 0; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<main>
  <h1>Québec French</h1>
  <p class="sub">An Android app for learning the French actually spoken in Québec —
  vocabulary, Québec-specific pronunciation, and an optional pack of spoken audio.</p>
  <ul>
    <li><a href="/privacy/">Privacy policy</a></li>
    <li><a href="https://github.com/mortal-dog/quebec-french-audio">Audio pack releases</a></li>
  </ul>
</main>
</body>
</html>
